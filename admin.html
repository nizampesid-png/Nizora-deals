
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nizora Deals Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#0f1115;
  --panel:#191d25;
  --input:#252b36;
  --line:#303744;
  --text:#f1f5f9;
  --muted:#9ca3af;
  --brand:#f97316;
  --green:#22c55e;
  --red:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.hidden{display:none!important}
button,input,select{font:inherit}
button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:bold;
}
button:disabled{opacity:.6;cursor:not-allowed}
.primary{background:var(--brand);color:#111}
.danger{background:#451d22;color:#fca5a5}
.ghost{
  background:var(--input);
  color:white;
  border:1px solid var(--line);
}
input{
  width:100%;
  padding:12px;
  margin-top:7px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--input);
  color:white;
  outline:none;
}
input:focus{border-color:var(--brand)}
label{
  display:block;
  margin-top:16px;
  color:var(--muted);
  font-size:13px;
}
.login-area{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  padding:22px;
}
.login-card{width:100%;max-width:390px}
h2{font-size:17px;margin-top:0}
.brand{
  color:var(--brand);
  font-size:23px;
  font-weight:bold;
  margin-bottom:20px;
}
.full{width:100%;margin-top:20px}
#dashboard{min-height:100vh}
.topbar{
  padding:17px 22px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.topbar small{color:var(--muted)}
.container{
  max-width:1200px;
  margin:auto;
  padding:22px;
}
.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:20px;
  align-items:start;
}
.dropzone{
  border:1px dashed var(--line);
  padding:20px;
  text-align:center;
  border-radius:9px;
  margin-top:8px;
  background:var(--input);
}
.dropzone button{margin-top:12px}
#image-input{display:none}
.preview{
  width:100%;
  max-height:190px;
  object-fit:cover;
  border-radius:9px;
  margin-top:12px;
}
.status{
  margin-top:14px;
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.ok{color:var(--green)}
.err{color:#fca5a5}
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:540px;
  font-size:13px;
}
th,td{
  padding:12px 9px;
  text-align:left;
  border-bottom:1px solid var(--line);
}
th{color:var(--muted)}
.thumb{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:7px;
}
.price{color:#fb923c;font-weight:bold}
.actions{
  display:flex;
  gap:6px;
}
.actions button{padding:9px 11px}
.form-actions{
  display:flex;
  gap:8px;
}
.form-actions button{flex:1}
@media(max-width:850px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login-view" class="login-area hidden">
  <div class="card login-card">
    <div class="brand">NZ Nizora Deals</div>
    <h2>Admin Login</h2>

    <form id="login-form">
      <label>Email</label>
      <input id="login-email" type="email" required autocomplete="username">

      <label>Password</label>
      <input id="login-password" type="password" required autocomplete="current-password">

      <button class="primary full" id="login-btn" type="submit">
        Sign In
      </button>
    </form>

    <div id="login-status" class="status"></div>
  </div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="hidden">

  <header class="topbar">
    <div>
      <strong class="brand">Nizora Deals</strong><br>
      <small>Admin Dashboard</small>
    </div>

    <div>
      <span id="user-email"></span>
      <button class="ghost" id="logout-btn">Logout</button>
    </div>
  </header>

  <main class="container">
    <div class="grid">

      <!-- ADD / EDIT PRODUCT -->
      <section class="card">
        <h2 id="form-heading">Add New Product</h2>

        <form id="product-form">

          <label>Product Name</label>
          <input id="product-name" type="text" required placeholder="Product name">

          <label>Price (₹)</label>
          <input id="product-price" type="number" min="0" step="0.01" required placeholder="Price">

<label>Category</label>
<select id="product-category" required>
  <option value="">Select Category</option>
  <option value="Men's Fashion">Men's Fashion</option>
  <option value="Women's Fashion">Women's Fashion</option>
  <option value="Kids & Baby">Kids & Baby</option>
  <option value="Electronics">Electronics</option>
  <option value="Home & Kitchen">Home & Kitchen</option>
  <option value="Beauty & Care">Beauty & Care</option>
  <option value="Footwear">Footwear</option>
  <option value="Bags & Accessories">Bags & Accessories</option>
  <option value="Fitness & Sports">Fitness & Sports</option>
  <option value="Toys & Games">Toys & Games</option>
  <option value="Furniture & Decor">Furniture & Decor</option>
  <option value="Daily Essentials">Daily Essentials</option>
</select>

          <label>Product Image</label>

          <div class="dropzone">
            <p>Select Product Image</p>
            <button type="button" class="ghost" id="choose-image">
              Choose Image
            </button>
            <input id="image-input" type="file"
              accept="image/png,image/jpeg,image/webp,image/gif">
          </div>

          <img id="preview" class="preview hidden" alt="Preview">

          <button type="button" class="ghost full hidden" id="remove-image">
            Remove Image
          </button>

          <label>Affiliate URL</label>
          <input id="affiliate-url" type="url" placeholder="https://">

          <div class="form-actions">
            <button class="primary full" id="save-btn" type="submit">
              Save Product
            </button>

            <button class="ghost full hidden" id="cancel-edit" type="button">
              Cancel
            </button>
          </div>
        </form>

        <div id="form-status" class="status"></div>
      </section>

      <!-- PRODUCTS -->
      <section class="card">
        <h2>Products <span id="product-count">0</span></h2>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Product</th>
                <th>Price</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="product-rows"></tbody>
          </table>
        </div>

        <div id="list-status" class="status"></div>
      </section>

    </div>
  </main>
</section>

<script>

/* CONFIG */
const SUPABASE_URL = 'https://sypovoosyxljuhphhuyq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_aSUt5u1YSAZzsUWtPEKopg_1ARx-55X';

const TABLE = 'products';
const BUCKET = 'product-images';
const MAX_BYTES = 5 * 1024 * 1024;

/* CLIENT */
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

/* ELEMENTS */
const $ = id => document.getElementById(id);

const loginView = $('login-view');
const dashboard = $('dashboard');
const loginForm = $('login-form');
const productForm = $('product-form');

let selectedFile = null;
let previewURL = null;
let editingProductId = null;
let currentImageUrl = null;
let removeCurrentImage = false;

/* STATUS */
function status(id,message,type='') {
  const el = $(id);
  el.textContent = message;
  el.className = 'status ' + type;
}

/* VIEW */
function showView(view) {
  loginView.classList.toggle('hidden',view !== 'login');
  dashboard.classList.toggle('hidden',view !== 'dashboard');
}

/* HTML ESCAPE */
function safe(value) {
  return String(value ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

/* LOGIN */
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();

  const btn = $('login-btn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  status('login-status','');

  try {
    const {error} = await supabaseClient.auth.signInWithPassword({
      email:$('login-email').value.trim(),
      password:$('login-password').value
    });

    if(error) throw error;

    $('login-password').value = '';
  } catch(error) {
    status('login-status',error.message,'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

/* LOGOUT */
$('logout-btn').addEventListener('click',async()=>{
  const {error} = await supabaseClient.auth.signOut();
  if(error) status('list-status',error.message,'err');
});

/* AUTH SESSION */
supabaseClient.auth.onAuthStateChange((_event,session)=>{
  if(session) {
    $('user-email').textContent = session.user.email || '';
    showView('dashboard');
    loadProducts();
  } else {
    $('user-email').textContent = '';
    $('product-rows').innerHTML = '';
    showView('login');
    resetProductForm();
  }
});

/* IMAGE PICKER */
$('choose-image').addEventListener('click',()=>{
  $('image-input').click();
});

$('image-input').addEventListener('change',e=>{
  const file = e.target.files[0];
  if(!file) return;

  const allowed = [
    'image/jpeg','image/png','image/webp','image/gif'
  ];

  if(!allowed.includes(file.type)) {
    status('form-status','Choose JPG, PNG, WEBP or GIF image.','err');
    e.target.value = '';
    return;
  }

  if(file.size > MAX_BYTES) {
    status('form-status','Image must be below 5 MB.','err');
    e.target.value = '';
    return;
  }

  selectedFile = file;
  removeCurrentImage = false;

  if(previewURL) URL.revokeObjectURL(previewURL);

  previewURL = URL.createObjectURL(file);
  $('preview').src = previewURL;
  $('preview').classList.remove('hidden');
  $('remove-image').classList.remove('hidden');

  status('form-status','Image selected.','ok');
});

/* CLEAR IMAGE PREVIEW */
function clearImage() {
  selectedFile = null;
  $('image-input').value = '';
  $('preview').removeAttribute('src');
  $('preview').classList.add('hidden');
  $('remove-image').classList.add('hidden');

  if(previewURL) {
    URL.revokeObjectURL(previewURL);
    previewURL = null;
  }
}

/* REMOVE IMAGE */
$('remove-image').addEventListener('click',()=>{
  clearImage();

  if(editingProductId) {
    removeCurrentImage = true;
  }

  status('form-status','Image removed from this product.','ok');
});

/* RESET FORM */
function resetProductForm() {
  productForm.reset();
  clearImage();

  editingProductId = null;
  currentImageUrl = null;
  removeCurrentImage = false;

  $('form-heading').textContent = 'Add New Product';
  $('save-btn').textContent = 'Save Product';
  $('cancel-edit').classList.add('hidden');

  status('form-status','');
}

/* CANCEL EDIT */
$('cancel-edit').addEventListener('click',()=>{
  resetProductForm();
});

/* UPLOAD IMAGE */
async function uploadImage(file) {
  const extension = file.name.split('.').pop().toLowerCase()
    .replace(/[^a-z0-9]/g,'');

  const filename = crypto.randomUUID() + '.' + extension;
  const path = 'products/' + filename;

  const {error} = await supabaseClient.storage
    .from(BUCKET)
    .upload(path,file,{
      cacheControl:'3600',
      upsert:false,
      contentType:file.type
    });

  if(error) throw new Error('Image upload failed: '+error.message);

  const {data} = supabaseClient.storage
    .from(BUCKET)
    .getPublicUrl(path);

  if(!data?.publicUrl) {
    throw new Error('Could not get public image URL.');
  }

  return data.publicUrl;
}

/* ADD / UPDATE PRODUCT */
productForm.addEventListener('submit',async e=>{
  e.preventDefault();

  const btn = $('save-btn');
  btn.disabled = true;

  const isEditing = Boolean(editingProductId);

  btn.textContent = isEditing ? 'Updating...' : 'Saving...';

  try {
    const name = $('product-name').value.trim();
    const price = Number($('product-price').value);
    const category = $('product-category').value.trim();
    const affiliate = $('affiliate-url').value.trim();

    if(!name || !category || !Number.isFinite(price) || price < 0) {
      throw new Error('Please enter valid product details.');
    }

    let imageUrl = currentImageUrl;

    if(selectedFile) {
      status('form-status','Uploading image...');
      imageUrl = await uploadImage(selectedFile);
    } else if(removeCurrentImage) {
      imageUrl = null;
    }

    const productData = {
      name:name,
      price:price,
      category:category,
      image_url:imageUrl,
      affiliate_url:affiliate || null
    };

    status('form-status',isEditing ? 'Updating product...' : 'Saving product...');

    let result;

    if(isEditing) {
      result = await supabaseClient
        .from(TABLE)
        .update(productData)
        .eq('id',editingProductId);
    } else {
      result = await supabaseClient
        .from(TABLE)
        .insert([productData]);
    }

    if(result.error) throw result.error;

    resetProductForm();

    status(
      'form-status',
      isEditing ? 'Product updated successfully!' : 'Product added successfully.',
      'ok'
    );

    await loadProducts();

  } catch(error) {
    status('form-status',error.message || 'Something went wrong.','err');
  } finally {
    btn.disabled = false;

    if(editingProductId) {
      btn.textContent = 'Update Product';
    } else {
      btn.textContent = 'Save Product';
    }
  }
});

/* LOAD PRODUCTS */
async function loadProducts() {
  status('list-status','Loading products...');

  const {data,error} = await supabaseClient
    .from(TABLE)
    .select('*')
    .order('created_at',{ascending:false});

  if(error) {
    status('list-status','Load failed: '+error.message,'err');
    return;
  }

  renderProducts(data || []);
}

/* RENDER PRODUCTS */
function renderProducts(products) {
  $('product-count').textContent = products.length;

  if(!products.length) {
    $('product-rows').innerHTML =
      '<tr><td colspan="4">No products found.</td></tr>';
    status('list-status','');
    return;
  }

  $('product-rows').innerHTML = products.map(p=>{
    const image = p.image_url
      ? '<img class="thumb" src="'+safe(p.image_url)+'" alt="">'
      : '—';

    return `
      <tr>
        <td>${image}</td>
        <td>${safe(p.name)}<br><small>${safe(p.category)}</small></td>
        <td class="price">₹${safe(p.price)}</td>
        <td>
          <div class="actions">
            <button class="ghost" type="button"
              data-edit="${safe(p.id)}">Edit</button>

            <button class="danger" type="button"
              data-delete="${safe(p.id)}">Delete</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  status('list-status','');
}

/* EDIT + DELETE PRODUCT */
$('product-rows').addEventListener('click',async e=>{

  const editBtn = e.target.closest('[data-edit]');
  const deleteBtn = e.target.closest('[data-delete]');

  /* EDIT PRODUCT */
  if(editBtn) {
    const id = editBtn.dataset.edit;

    editBtn.disabled = true;

    try {
      const {data:product,error} = await supabaseClient
        .from(TABLE)
        .select('*')
        .eq('id',id)
        .single();

      if(error) throw error;

      resetProductForm();

      editingProductId = id;
      currentImageUrl = product.image_url || null;
      removeCurrentImage = false;

      $('product-name').value = product.name || '';
      $('product-price').value = product.price ?? '';
      $('product-category').value = product.category || '';
      $('affiliate-url').value = product.affiliate_url || '';

      if(currentImageUrl) {
        $('preview').src = currentImageUrl;
        $('preview').classList.remove('hidden');
        $('remove-image').classList.remove('hidden');
      }

      $('form-heading').textContent = 'Edit Product';
      $('save-btn').textContent = 'Update Product';
      $('cancel-edit').classList.remove('hidden');

      status('form-status','Editing: '+product.name,'ok');

      $('product-form').scrollIntoView({
        behavior:'smooth',
        block:'start'
      });

    } catch(error) {
      status('list-status','Edit failed: '+error.message,'err');
    } finally {
      editBtn.disabled = false;
    }

    return;
  }

  /* DELETE PRODUCT */
  if(deleteBtn) {
    const id = deleteBtn.dataset.delete;

    if(!confirm('Are you sure you want to delete this product?')) {
      return;
    }

    deleteBtn.disabled = true;
    deleteBtn.textContent = 'Deleting...';

    const {error} = await supabaseClient
      .from(TABLE)
      .delete()
      .eq('id',id);

    if(error) {
      status('list-status','Delete failed: '+error.message,'err');
      deleteBtn.disabled = false;
      deleteBtn.textContent = 'Delete';
      return;
    }

    if(editingProductId === id) {
      resetProductForm();
    }

    status('list-status','Product deleted successfully.','ok');
    await loadProducts();
  }
});

/* START */
(async function startAdmin() {
  try {
    const {data,error} = await supabaseClient.auth.getSession();

    if(error) throw error;

    if(data.session) {
      $('user-email').textContent = data.session.user.email || '';
      showView('dashboard');
      await loadProducts();
    } else {
      showView('login');
    }

  } catch(error) {
    showView('login');
    status('login-status','Startup error: '+error.message,'err');
  }
})();

</script>
</body>
</html>
